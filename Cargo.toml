[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]
exclude = ["crates/ww-package/fuzz"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cig13zs/wallweaver"
homepage = "https://github.com/cig13zs/wallweaver"
authors = ["Wallweaver contributors"]

[workspace.dependencies]
ww-manifest = { path = "crates/ww-manifest", version = "0.1.0-alpha.1" }
ww-package = { path = "crates/ww-package", version = "0.1.0-alpha.1" }
ww-permissions = { path = "crates/ww-permissions", version = "0.1.0-alpha.1" }
ww-governor = { path = "crates/ww-governor", version = "0.1.0-alpha.1" }
ww-desktop = { path = "crates/ww-desktop", version = "0.1.0-alpha.1" }

ww-ipc = { path = "crates/ww-ipc", version = "0.1.0-alpha.1" }
ww-render = { path = "crates/ww-render", version = "0.1.0-alpha.1" }
ww-bench = { path = "crates/ww-bench", version = "0.1.0-alpha.1" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
proptest = { version = "1", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Smallest binaries, for size comparisons: cargo build --profile release-small
[profile.release-small]
inherits = "release"
opt-level = "s"

# Image decoding and shader compilation are painfully slow unoptimized;
# optimize dependencies even in debug builds so tests run quickly.
[profile.dev.package."*"]
opt-level = 2
