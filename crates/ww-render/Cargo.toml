[package]
name = "ww-render"
description = "Wallweaver's native wallpaper renderer: images, slideshows, animated images and shaders on wgpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ww-manifest.workspace = true
thiserror.workspace = true
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
naga = { version = "30", features = ["glsl-in", "wgsl-in"] }
pollster = "1"
raw-window-handle = "0.6"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "naga-ir"] }

# Only the native graphics API of each platform is compiled in.
[target.'cfg(windows)'.dependencies]
wgpu = { version = "30", default-features = false, features = ["dx12"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["metal"] }

[target.'cfg(all(unix, not(target_vendor = "apple")))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["vulkan", "gles"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
