[package]
name = "ww-desktop"
description = "Desktop hosts for Wallweaver: put a window behind the desktop icons on each OS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ww-governor.workspace = true
thiserror.workspace = true
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(target_vendor = "apple")'.dependencies]
libc = "0.2"

[target.'cfg(all(unix, not(target_vendor = "apple")))'.dependencies]
x11rb = { version = "0.14", default-features = false, features = ["allow-unsafe-code", "dl-libxcb", "randr", "shape"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
