name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Linux system packages
        if: runner.os == 'Linux'
        # webkit/gtk for the Tauri manager app, lavapipe so the renderer
        # tests draw on a software Vulkan adapter, libxcb for the X11 host.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev \
            libxcb1-dev mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The manager app embeds ui/dist at compile time, so the UI is built
      # before any cargo command that touches the whole workspace.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Build UI
        run: |
          pnpm -C ui install --frozen-lockfile
          pnpm -C ui build

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        env:
          # Linux has lavapipe installed above, so GPU tests must run there.
          WW_REQUIRE_GPU: ${{ runner.os == 'Linux' && '1' || '' }}
        run: cargo test --workspace --locked

      - name: Release build of ww-daemon
        shell: bash
        run: |
          cargo build --release --locked -p ww-daemon
          bin=target/release/ww-daemon
          [ -f "$bin.exe" ] && bin="$bin.exe"
          size=$(wc -c < "$bin")
          echo "ww-daemon release binary on ${{ matrix.os }}: $size bytes" | tee -a "$GITHUB_STEP_SUMMARY"

  ui:
    name: UI checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm -C ui install --frozen-lockfile
      - run: pnpm -C ui check
      - run: pnpm -C ui build
      - run: pnpm -C ui test
